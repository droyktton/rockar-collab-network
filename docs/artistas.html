<script>
  const artists = JSON.parse(document.getElementById('data').textContent);
  const rowsEl = document.getElementById('rows');
  const countEl = document.getElementById('count');
  const emptyEl = document.getElementById('empty');
  const searchEl = document.getElementById('search');
  let sortKey = 'degree';

  function norm(s) {
    return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function render() {
    const q = norm(searchEl.value.trim());
    let list = artists.filter(a => norm(a.name).includes(q));
    list.sort((a, b) => sortKey === 'degree'
      ? b.degree - a.degree
      : a.name.localeCompare(b.name, 'es'));

    countEl.textContent = q ? `${list.length} de ${artists.length} artistas` : `${artists.length} artistas`;
    emptyEl.style.display = list.length ? 'none' : 'block';

    const frag = document.createDocumentFragment();
    for (const a of list) {
      const tr = document.createElement('tr');
      const tdName = document.createElement('td');
      const link = document.createElement('a');
      link.href = a.url; link.target = '_blank'; link.rel = 'noopener';
      link.textContent = a.name;
      tdName.appendChild(link);
      const tdDeg = document.createElement('td');
      tdDeg.className = 'num';
      if (a.has_ego) {
        const linkDeg = document.createElement('a');
        linkDeg.href = 'ego/' + a.slug + '.html';
        linkDeg.title = 'Ver la red de colaboración de este artista';
        linkDeg.textContent = a.degree + ' 🕸️';
        tdDeg.appendChild(linkDeg);
      } else {
        tdDeg.textContent = a.degree;
      }
      tr.appendChild(tdName); tr.appendChild(tdDeg);
      frag.appendChild(tr);
    }
    rowsEl.innerHTML = '';
    rowsEl.appendChild(frag);
  }

  searchEl.addEventListener('input', render);
  document.querySelectorAll('.sortbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sortbtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      sortKey = btn.dataset.sort;
      render();
    });
  });

  render();
