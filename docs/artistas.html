    line-height: 0.95; margin: 0 0 14px;
  }
  .back { font-size: 0.9rem; color: var(--paper-dim); }
  .controls {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    margin: 24px 0; padding: 20px 0; border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }
  #search {

  .sortbtn {
    background: transparent; border: 1px solid var(--rule); color: var(--paper-dim);

  }
  .sortbtn.active { border-color: var(--gold); color: var(--gold); }
  #count { color: var(--paper-dim); font-size: 0.9rem; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 600; color: var(--paper-dim);
       font-size: 0.85rem; padding: 8px 10px; border-bottom: 1px solid var(--rule); }
  td { padding: 10px; border-bottom: 1px solid var(--rule); font-size: 0.95rem; }
  td.num { color: var(--gold); font-variant-numeric: tabular-nums; width: 90px; }
  tr:hover td { background: #1e1a14; }
  .empty { color: var(--paper-dim); padding: 30px 0; text-align: center; }
</style>

</div>

<script>
  const artists = JSON.parse(document.getElementById('data').textContent);
  const rowsEl = document.getElementById('rows');
  const countEl = document.getElementById('count');
  const emptyEl = document.getElementById('empty');
  const searchEl = document.getElementById('search');
  let sortKey = 'degree';

  function norm(s) {
    return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function render() {
    const q = norm(searchEl.value.trim());
    let list = artists.filter(a => norm(a.name).includes(q));
    list.sort((a, b) => sortKey === 'degree'
      ? b.degree - a.degree
      : a.name.localeCompare(b.name, 'es'));

    countEl.textContent = q ? `${list.length} de ${artists.length} artistas` : `${artists.length} artistas`;
    emptyEl.style.display = list.length ? 'none' : 'block';

    const frag = document.createDocumentFragment();
    for (const a of list) {
      const tr = document.createElement('tr');
      const tdName = document.createElement('td');
      const link = document.createElement('a');
      link.href = a.url; link.target = '_blank'; link.rel = 'noopener';
      link.textContent = a.name;
      tdName.appendChild(link);
      const tdDeg = document.createElement('td');
      tdDeg.className = 'num';
      tdDeg.textContent = a.degree;
      tr.appendChild(tdName); tr.appendChild(tdDeg);
      frag.appendChild(tr);
    }
    rowsEl.innerHTML = '';
    rowsEl.appendChild(frag);
  }

  searchEl.addEventListener('input', render);
  document.querySelectorAll('.sortbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sortbtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      sortKey = btn.dataset.sort;
      render();
    });
  });

  render();
</script>
